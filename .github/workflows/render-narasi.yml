# Render narasi jadi file suara (Azure Speech), lalu commit hasilnya.
#
# Ini dijalankan di server GitHub, bukan di komputer pemilik: tidak perlu
# memasang Node.js, dan koneksinya tidak dibatasi.
#
# SEBELUM MENJALANKAN, isi dulu di GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     AZURE_SPEECH_KEY = KEY 1 dari portal Azure
#   (Region bawaan southeastasia. Kalau resource-mu di region lain, tambahkan
#    variable AZURE_SPEECH_REGION di tab "Variables".)
#
# Dua cara menjalankan:
#   1. Tab Actions → "Render narasi" → Run workflow (bisa pilih game & kecepatan).
#      Tombol ini baru muncul setelah workflow ada di branch utama.
#   2. Ubah isi `.github/render-request.txt` lalu push — dipakai saat bekerja di
#      branch fitur, sebelum workflow-nya ada di branch utama.
name: Render narasi

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Render satu bagian saja (mis. cerita-kancil). Kosong = semua.'
        required: false
        default: ''
      rpm:
        description: 'Permintaan per menit (20 = batas tier gratis F0)'
        required: false
        default: '20'
      prune:
        description: 'Buang file audio yang kalimatnya sudah dihapus dari config'
        type: boolean
        required: false
        default: false
      redo_lafal:
        description: 'Render ulang baris yang ejaan lafalnya berubah (scripts/pronounce.mjs)'
        type: boolean
        required: false
        default: false
  push:
    paths:
      - .github/render-request.txt

# Satu render per branch pada satu waktu: dua job paralel akan saling menimpa
# commit audionya, dan sama-sama memakan kuota Azure untuk file yang sama.
concurrency:
  group: render-narasi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # 723 baris pada 20 permintaan/menit ≈ 36 menit; beri kelonggaran untuk
    # baris yang perlu diulang.
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Pastikan kunci Azure sudah diisi
        env:
          KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret AZURE_SPEECH_KEY belum diisi."
            echo "Isi di Settings → Secrets and variables → Actions → New repository secret."
            exit 1
          fi

      # Kalimat narasi diambil ulang dari config, jadi hasil render selalu
      # cocok dengan isi game saat ini — bukan daftar lama yang ikut ter-commit.
      - name: Kumpulkan kalimat narasi
        run: npm run narasi

      # Baris "only: <bagian>" di file pemicu membatasi render ke satu game —
      # cara mencoba beberapa kalimat dulu sebelum render penuh. Sengaja dibatasi
      # huruf/angka/strip: isi file ini masuk ke baris perintah.
      - name: Baca permintaan render
        id: req
        run: |
          SCOPE=$(grep -oE '^only: *[a-z0-9_-]+' .github/render-request.txt | head -1 | sed 's/^only: *//' || true)
          echo "Bagian yang diminta: ${SCOPE:-semua}"
          echo "only=$SCOPE" >> "$GITHUB_OUTPUT"
          # Baris "redo: lafal" memaksa render ulang baris yang ejaan lafalnya
          # berubah — `key` berasal dari teks layar yang tidak berubah, jadi
          # tanpa ini file lamanya cuma dilewati.
          if grep -qE '^redo: *lafal' .github/render-request.txt; then
            echo 'Render ulang: baris yang tersentuh daftar lafal'
            echo 'redo=--redo-lafal' >> "$GITHUB_OUTPUT"
          fi

      - name: Render suara
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'southeastasia' }}
          ONLY: ${{ inputs.only || steps.req.outputs.only }}
          RPM: ${{ inputs.rpm || '20' }}
          PRUNE: ${{ inputs.prune && '--prune' || '' }}
          REDO: ${{ inputs.redo_lafal && '--redo-lafal' || steps.req.outputs.redo }}
        run: |
          npm run suara -- \
            ${ONLY:+--only="$ONLY"} \
            --rpm="${RPM:-20}" \
            $PRUNE $REDO

      - name: Commit hasilnya
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/voice scripts/narration-lines.json
          if git diff --cached --quiet; then
            echo 'Tidak ada file suara baru — semua sudah ada.'
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | grep -c '\.mp3$' || true)
          git commit -m "Render $COUNT file suara narasi (Azure Speech)"
          # Branch bisa saja bergerak selama render 36 menit.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
