# Pemeriksaan otomatis tiap ada perubahan kode.
#
# Gunanya: menangkap error TypeScript atau build yang gagal SEBELUM hasilnya
# ter-deploy. Sebelum ini tidak ada yang memeriksa — satu typo di config game
# bisa lolos sampai ke HP anak.
#
# Tidak perlu disetel apa-apa: tidak butuh secret, dan jalan sendiri.
name: Periksa kode

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Kalau ada push baru di branch yang sama, batalkan pemeriksaan yang lama —
# yang menentukan cuma commit terakhir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  periksa:
    name: Typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependency
        run: npm ci

      - name: Typecheck (TypeScript strict)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # PENJAGA BUILD PENGUJI (lihat guardTesterBuild di vite.config.ts): build
      # yang membuka semua game tidak boleh sampai ke situs pembeli. Dua sisi:
      # (1) build rilis di atas harus bersih dari tanda build penguji, dan
      # (2) build penguji TANPA base "/uji-…/" harus gagal (kalau tidak, penjaga
      # itu sudah hilang diam-diam).
      - name: Build rilis harus bersih dari tanda build penguji
        run: node scripts/check-release-build.mjs dist

      - name: Build penguji tanpa base uji harus DITOLAK
        run: |
          if VITE_ALLOW_TEST_TOGGLE=1 npx vite build --outDir /tmp/dist-uji-salah; then
            echo "Build penguji tanpa DEPLOY_BASE /uji-…/ seharusnya gagal, tapi lolos." >&2
            exit 1
          fi

      # Cloud Functions punya package.json sendiri (deployable terpisah), jadi
      # tidak ikut terperiksa oleh typecheck di atas.
      - name: Pasang dependency Cloud Functions
        working-directory: functions
        run: npm ci

      - name: Typecheck + build Cloud Functions
        working-directory: functions
        run: npm run build

      # Soal "sentuh gambar" (Anggota Tubuh): bagian tubuh yang berdempetan
      # membuat daerah sentuhnya menciut tanpa terlihat saat dicoba sekali di
      # layar besar. Skrip ini mengukurnya untuk SEMUA varian di HP terkecil.
      - name: Periksa soal sentuh gambar
        run: node scripts/check-body-parts.mjs

      # Level "tulis" (Tulis Angka, Tulis Huruf): huruf tanpa data goresan
      # membuat layarnya kosong — sejak template ini jadi rel, tak ada lagi
      # jalan mundur ke font HP. Skrip ini juga mengukur goresan terpendek.
      - name: Periksa soal tulis
        run: node scripts/check-glyphs.mjs

      # Sinkron bintang ke Firestore harus MENGGABUNG (maksimum per level),
      # tidak menimpa. Kalau ini jadi penulisan biasa, anak yang main di
      # tablet lalu di HP kehilangan bintang tabletnya — dan itu cuma
      # ketahuan di perangkat kedua orang tua, berminggu-minggu kemudian.
      - name: Periksa sinkron bintang (gabung, bukan timpa)
        run: node scripts/check-progress-merge.mjs

      # Narasi tidak boleh memuat digit — mesin suara membacanya dalam bahasa
      # sendiri ("6 singa" jadi "six singa"). Skrip ini keluar dengan kode 1
      # kalau ada yang lolos. Lihat CLAUDE.md bagian "ANGKA DI NARASI".
      - name: Periksa narasi (tanpa angka digit)
        run: npm run narasi
