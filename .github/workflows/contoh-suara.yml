# Render beberapa kalimat contoh untuk dipilih dengan telinga sebelum ratusan
# baris narasi dirender. Dipicu dengan mengubah `.github/sample-request.txt`.
#
# Dua jenis contoh, dipilih lewat baris `mode:` di file pemicu itu:
#   mode: suara  (bawaan) — membandingkan SETELAN SUARA (voice/rate/pitch)
#   mode: lafal            — membandingkan EJAAN LAFAL kata ber-e taling
#                            (bebek → bébék), lihat scripts/pronounce.mjs
#
# Hasilnya masuk folder `sample-suara/` (di luar public/), jadi tidak pernah
# ikut ter-deploy. Hapus foldernya setelah setelan suaranya diputuskan.
name: Contoh suara

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'suara (setelan voice) atau lafal (ejaan e taling)'
        type: choice
        options: [suara, lafal]
        default: suara
  push:
    paths:
      - .github/sample-request.txt

concurrency:
  group: contoh-suara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contoh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Baris "mode: lafal" di file pemicu memilih contoh EJAAN, bukan contoh
      # setelan suara. Sengaja dibatasi huruf: isinya masuk ke perbandingan di
      # bawah.
      - name: Baca mode contoh
        id: req
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            MODE=$(grep -oE '^mode: *[a-z]+' .github/sample-request.txt | head -1 | sed 's/^mode: *//' || true)
          fi
          echo "Mode: ${MODE:-suara}"
          echo "mode=${MODE:-suara}" >> "$GITHUB_OUTPUT"

      - name: Render contoh
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION || 'southeastasia' }}
        run: |
          if [ "${{ steps.req.outputs.mode }}" = "lafal" ]; then
            node scripts/sample-lafal.mjs
          else
            node scripts/sample-voices.mjs
          fi

      - name: Commit contohnya
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sample-suara
          git diff --cached --quiet && exit 0
          git commit -m 'Contoh ${{ steps.req.outputs.mode }} untuk dipilih'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
