# SEMENTARA (sesi 2026-10-06): sesi Claude tidak bisa mengunduh paket npm
# (registry diblokir kebijakan jaringan sesi), jadi build penguji untuk uji
# headless dibuat di sini lalu diunduh. Hanya jalan di branch ini; berkas ini
# DIHAPUS sebelum branch di-merge.
name: Build penguji (sementara)
on:
  push:
    branches: [claude/cool-mendel-vmzfe8]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run narasi
      - name: Build penguji
        env:
          DEPLOY_BASE: /uji-sd2/
          VITE_USE_HASH_ROUTER: '1'
          VITE_ALLOW_TEST_TOGGLE: '1'
          VITE_LOCK_MODE: buka
        run: npx vite build --outDir dist-uji
      # Artifact tidak bisa diunduh dari sesi (blob storage diblokir), jadi
      # hasilnya didorong ke branch sementara yang DIHAPUS sesudah diuji.
      - name: Dorong ke branch sementara
        run: |
          rm -rf dist-uji/assets/voice
          cp scripts/narration-lines.json dist-uji/
          cd dist-uji
          git init -q -b uji
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A && git commit -qm "build penguji ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" uji:claude/uji-build-tmp
