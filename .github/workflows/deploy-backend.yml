# Men-deploy Cloud Functions + Firestore security rules ke project Firebase.
#
# BELUM PERNAH DIJALANKAN: saat workflow ini ditulis, project Firebase-nya
# belum dibuat. Jalankan pertama kali dengan "Cuma periksa" (dry run) dulu.
#
# SEBELUM MENJALANKAN, isi dulu di GitHub:
#   Settings → Secrets and variables → Actions
#     Secret   FIREBASE_SERVICE_ACCOUNT = isi file JSON service account
#              (Firebase Console → Project settings → Service accounts →
#               "Generate new private key", tempel SELURUH isi file-nya)
#     Variable FIREBASE_PROJECT_ID      = id project, mis. petualangan-pintar
#
#   Service account-nya butuh peran: Firebase Admin, Cloud Functions Admin,
#   Service Account User, dan Cloud Datastore Owner (untuk rules).
#
# Cara memakai: tab Actions → "Deploy backend" → Run workflow.
name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Apa yang di-deploy'
        required: true
        type: choice
        default: 'functions,firestore:rules'
        options:
          - 'functions,firestore:rules'
          - 'functions'
          - 'firestore:rules'
      dry_run:
        description: 'Cuma periksa, jangan benar-benar deploy'
        required: false
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Pasang dependency Cloud Functions
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Siapkan kredensial
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT belum diisi."
            exit 1
          fi
          if [ -z "${{ vars.FIREBASE_PROJECT_ID }}" ]; then
            echo "::error::Variable FIREBASE_PROJECT_ID belum diisi."
            exit 1
          fi
          # Ditulis ke luar folder kerja supaya tidak mungkin ikut ter-deploy.
          printf '%s' "$SA" > "$RUNNER_TEMP/service-account.json"

      - name: Deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run — memeriksa saja, tidak men-deploy."
            npx --yes firebase-tools@13 deploy \
              --only '${{ inputs.target }}' \
              --project '${{ vars.FIREBASE_PROJECT_ID }}' \
              --dry-run
          else
            npx --yes firebase-tools@13 deploy \
              --only '${{ inputs.target }}' \
              --project '${{ vars.FIREBASE_PROJECT_ID }}' \
              --non-interactive \
              --force
          fi

      - name: Hapus kredensial
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"
