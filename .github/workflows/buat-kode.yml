# Membuat batch kode aktivasi untuk dijual di Lynk.id / Mayar.id.
#
# SENGAJA hanya bisa dijalankan lewat tombol (workflow_dispatch), tidak pernah
# otomatis dari push: tiap kali jalan, ia mencetak barang yang bisa dijual.
#
# SEBELUM MENJALANKAN, isi dulu di GitHub:
#   Settings → Secrets and variables → Actions → New repository secret
#     FIREBASE_SERVICE_ACCOUNT = isi file JSON service account
#       (Firebase Console → Project settings → Service accounts →
#        "Generate new private key", lalu tempel SELURUH isi file-nya)
#
# Cara memakai:
#   Tab Actions → "Buat kode aktivasi" → Run workflow → pilih kelompok & jumlah.
#   Hasilnya diunduh sebagai artifact "kode-aktivasi" (file CSV).
name: Buat kode aktivasi

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'Kelompok yang dibuka kode ini'
        required: true
        type: choice
        options: [tk, sd1]
      count:
        description: 'Berapa kode dibuat (1-500)'
        required: true
        default: '50'
      batch:
        description: 'Penanda batch untuk pembukuan (mis. juli-tiktok)'
        required: false
        default: ''
      dry_run:
        description: 'Cuma lihat contoh kodenya, jangan simpan ke Firestore'
        required: false
        type: boolean
        default: false

jobs:
  buat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Pasang dependency
        working-directory: functions
        run: npm ci

      - name: Buat kode
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          node scripts/generate-codes.mjs \
            --group='${{ inputs.group }}' \
            --count='${{ inputs.count }}' \
            ${{ inputs.batch && format('--batch=''{0}''', inputs.batch) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '--out=kode-aktivasi.csv' }}

      - name: Unggah CSV
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: kode-aktivasi
          path: functions/kode-aktivasi.csv
          # Kode = barang jualan. Jangan disimpan lebih lama dari perlunya;
          # unduh, masukkan ke Lynk.id/Mayar.id, lalu biarkan kedaluwarsa.
          retention-days: 7
