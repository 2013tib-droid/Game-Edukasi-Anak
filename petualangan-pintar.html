<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD1DC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petualangan Pintar">
<title>🌈 Petualangan Pintar — Game Edukasi Anak Pra-SD</title>
<link rel="icon" href="./assets/logo.svg" type="image/svg+xml">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Fredoka','Baloo 2','Segoe UI',system-ui,sans-serif;
    color:#3A2E20; min-height:100vh;
    background:linear-gradient(180deg,#FFE9A8 0%,#FFD1DC 60%,#C9F0FF 100%);
    background-attachment:fixed;
    transition:background .5s;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 14px 40px; overflow-x:hidden;
    user-select:none;
  }
  .wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:14px}
  .topbar{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .btn{
    background:#fff;border:none;border-radius:22px;box-shadow:0 6px 0 rgba(0,0,0,.22);
    cursor:pointer;font-family:inherit;color:#3A2E20;
    transition:transform .1s,box-shadow .1s;
  }
  .btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
  .btn:disabled{cursor:default;opacity:.6}
  .btn:focus-visible{outline:4px solid #3A2E20;outline-offset:2px}
  a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
  .icon-btn{padding:8px 15px;font-size:20px;font-weight:700}
  .stars{background:rgba(255,255,255,.85);border-radius:999px;padding:8px 18px;font-weight:700;font-size:20px;box-shadow:0 3px 0 rgba(0,0,0,.12)}
  h1{text-align:center;font-size:32px;margin:2px 0;text-shadow:0 2px 0 #fff}
  .card{background:rgba(255,255,255,.94);border-radius:26px;padding:18px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
  .world-btn{display:flex;align-items:center;gap:14px;padding:14px;text-align:left;width:100%}
  .world-emoji{font-size:44px;border-radius:18px;width:70px;height:70px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .title{font-weight:700;font-size:21px}
  .sub{font-size:15px;opacity:.7}
  .bar{background:#eee;border-radius:999px;height:14px;margin-top:6px;overflow:hidden}
  .bar>div{background:linear-gradient(90deg,#FFC93C,#FF8A5C);height:100%;transition:width .4s}
  .dots{display:flex;justify-content:center;gap:8px}
  .dot{width:16px;height:16px;border-radius:999px;background:rgba(255,255,255,.4);box-shadow:0 2px 0 rgba(0,0,0,.15)}
  .dot.done{background:#FFC93C}.dot.now{background:#fff}
  .opts{display:grid;gap:12px}
  .opt{font-size:40px;font-weight:700;padding:20px 8px;display:flex;align-items:center;justify-content:center;min-height:88px}
  .prompt{font-weight:700;font-size:22px}
  .good{background:#B9F6CA!important}.bad{background:#FFCDD2!important}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes fall{to{transform:translateY(120vh) rotate(360deg)}}
  .pop{animation:pop .35s ease}.shake{animation:shake .4s}.bounce{animation:bounce 2.2s ease-in-out infinite}
  .confetti{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:5}
  .confetti span{position:absolute;top:-10%;animation:fall linear infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <button class="btn icon-btn" id="back">⬅️</button>
  <div class="stars" id="starCount">⭐ 0</div>
  <button class="btn icon-btn" id="sound">🔊</button>
</div>

<div class="wrap" id="app"></div>

<script>
/* ============ DATA ============ */
const ANIMALS=["🦁","🐰","🐸","🦊","🐼","🐵","🦒","🐘","🐯","🦆","🐢","🐝","🦋","🐞","🦜","🐿️"];
const EASY=[{w:"Roket",e:"🚀"},{w:"Bulan",e:"🌙"},{w:"Bintang",e:"⭐"},{w:"Matahari",e:"☀️"},{w:"Planet",e:"🪐"},{w:"Robot",e:"🤖"},{w:"Bumi",e:"🌍"},{w:"Awan",e:"☁️"},{w:"Petir",e:"⚡"},{w:"Balon",e:"🎈"},{w:"Pesawat",e:"✈️"},{w:"Burung",e:"🐦"},{w:"Layangan",e:"🪁"},{w:"Hujan",e:"🌧️"},{w:"Salju",e:"❄️"},{w:"Rumah",e:"🏠"},{w:"Pohon",e:"🌳"},{w:"Bunga",e:"🌸"},{w:"Bola",e:"⚽"},{w:"Buku",e:"📖"},{w:"Topi",e:"👒"},{w:"Sepatu",e:"👟"},{w:"Payung",e:"☂️"},{w:"Mobil",e:"🚗"},{w:"Kursi",e:"🪑"}];
const HARD=[{w:"Komet",e:"☄️"},{w:"Teleskop",e:"🔭"},{w:"Galaksi",e:"🌌"},{w:"Satelit",e:"🛰️"},{w:"Astronot",e:"🧑‍🚀"},{w:"Meteor",e:"💫"},{w:"Pelangi",e:"🌈"},{w:"Gerhana",e:"🌘"},{w:"Kelelawar",e:"🦇"},{w:"Kembang Api",e:"🎆"},{w:"Helikopter",e:"🚁"},{w:"Parasut",e:"🪂"},{w:"Bintang Jatuh",e:"🌠"},{w:"Bulan Purnama",e:"🌕"},{w:"Kacamata",e:"👓"},{w:"Gunting",e:"✂️"},{w:"Jendela",e:"🪟"},{w:"Telepon",e:"📱"},{w:"Komputer",e:"💻"},{w:"Lampu",e:"💡"},{w:"Kunci",e:"🔑"},{w:"Sepeda",e:"🚲"},{w:"Kereta Api",e:"🚂"}];
const SPELL_WORDS=[{w:"BUMI",e:"🌍"},{w:"AWAN",e:"☁️"},{w:"BULAN",e:"🌙"},{w:"ROKET",e:"🚀"},{w:"ROBOT",e:"🤖"},{w:"KOMET",e:"☄️"},{w:"PETIR",e:"⚡"},{w:"BALON",e:"🎈"},{w:"SALJU",e:"❄️"},{w:"HUJAN",e:"🌧️"},{w:"PLANET",e:"🪐"},{w:"LANGIT",e:"🌤️"},{w:"BOLA",e:"⚽"},{w:"BUKU",e:"📖"},{w:"RUMAH",e:"🏠"},{w:"POHON",e:"🌳"},{w:"MOBIL",e:"🚗"},{w:"IKAN",e:"🐟"},{w:"BUNGA",e:"🌸"}];
let spellOrder=[];
const CONF={B:["b","d","p"],D:["d","b","p"],M:["m","n","w"],P:["p","q","b"],A:["a","e","o"],S:["s","z","c"],K:["k","h","t"],R:["r","n","m"],G:["g","q","p"],T:["t","f","l"],E:["e","a","o"],N:["n","m","u"],L:["l","i","t"],U:["u","v","n"],H:["h","n","b"],J:["j","i","g"],C:["c","e","o"],F:["f","t","r"],I:["i","l","j"],Y:["y","v","w"],O:["o","a","c"],V:["v","u","w"],W:["w","m","v"],Z:["z","s","x"]};
const SHAPES=[{id:"lingkaran",label:"Lingkaran"},{id:"kotak",label:"Kotak"},{id:"segitiga",label:"Segitiga"},{id:"bintang",label:"Bintang"},{id:"hati",label:"Hati"},{id:"oval",label:"Oval"},{id:"ketupat",label:"Belah Ketupat"}];
const COLORS=[{id:"merah",label:"Merah",hex:"#EF5350"},{id:"biru",label:"Biru",hex:"#42A5F5"},{id:"kuning",label:"Kuning",hex:"#FFC93C"},{id:"hijau",label:"Hijau",hex:"#66BB6A"},{id:"ungu",label:"Ungu",hex:"#AB47BC"},{id:"oranye",label:"Oranye",hex:"#FFA726"},{id:"pink",label:"Merah Muda",hex:"#F48FB1"},{id:"coklat",label:"Coklat",hex:"#8D6E63"}];
const MASCOTS=[{min:0,emoji:"🥚",name:"Telur Ajaib"},{min:10,emoji:"🐣",name:"Si Menetas"},{min:25,emoji:"🐥",name:"Anak Ayam Ceria"},{min:45,emoji:"🦉",name:"Burung Hantu Pintar"},{min:70,emoji:"🦄",name:"Unicorn Ajaib"},{min:100,emoji:"🐲",name:"Naga Jenius"}];
const FRUITS=[
 {id:"apel",name:"Apel",e:"🍎",color:"merah"},
 {id:"stroberi",name:"Stroberi",e:"🍓",color:"merah"},
 {id:"ceri",name:"Ceri",e:"🍒",color:"merah"},
 {id:"semangka",name:"Semangka",e:"🍉",color:"merah"},
 {id:"pisang",name:"Pisang",e:"🍌",color:"kuning"},
 {id:"nanas",name:"Nanas",e:"🍍",color:"kuning"},
 {id:"lemon",name:"Lemon",e:"🍋",color:"kuning"},
 {id:"jeruk",name:"Jeruk",e:"🍊",color:"oranye"},
 {id:"mangga",name:"Mangga",e:"🥭",color:"oranye"},
 {id:"pir",name:"Pir",e:"🍐",color:"hijau"},
 {id:"melon",name:"Melon",e:"🍈",color:"hijau"},
 {id:"kiwi",name:"Kiwi",e:"🥝",color:"hijau"},
 {id:"anggur",name:"Anggur",e:"🍇",color:"ungu"},
 {id:"kelapa",name:"Kelapa",e:"🥥",color:"coklat"}];
const WORLDS=[
 {id:"forest",name:"Hutan Hewan",subtitle:"Ayo Berhitung!",emoji:"🦁",bg:"linear-gradient(160deg,#A8E063,#56AB2F)",accent:"#2E7D32",light:"#E8F5E9",levels:4,
  levelNames:["Hitung Hewan","Hitung Banyak","Tambah-Tambahan","Hewan Pulang"]},
 {id:"space",name:"Luar Angkasa",subtitle:"Kenali Huruf!",emoji:"🚀",bg:"linear-gradient(160deg,#7F7FD5,#4A3F9F)",accent:"#3F3D8F",light:"#EDEAFB",levels:4,
  levelNames:["Huruf Pertama","Huruf Kecil","Kata Antariksa","Susun Kata"]},
 {id:"ocean",name:"Bawah Laut",subtitle:"Warna & Bentuk!",emoji:"🐠",bg:"linear-gradient(160deg,#4DD0E1,#0083B0)",accent:"#00697F",light:"#E0F7FA",levels:4,
  levelNames:["Cari Bentuk","Cari Warna","Bentuk & Warna","Pola Ajaib"]},
 {id:"fruit",name:"Pasar Buah",subtitle:"Kenali Buah-buahan!",emoji:"🍉",bg:"linear-gradient(160deg,#FFC06B,#F25C2A)",accent:"#B33F12",light:"#FFF3E0",levels:4,
  levelNames:["Beli Buah","Tebak Buah","Keranjang Warna","Kartu Buah"]}];
const HOME_BG="linear-gradient(180deg,#FFE9A8 0%,#FFD1DC 60%,#C9F0FF 100%)";
const PER_LEVEL=7;
/* Demo build: only level 1 of each world is playable; higher levels ship in the paid version.
   Owner testing: open with ?akses=penuh2026 to unlock everything. */
const DEMO_MODE=new URLSearchParams(location.search).get("akses")!=="penuh2026";
const demoLocked=lv=>DEMO_MODE&&lv>1;

/* ============ STATE ============ */
let S={stars:0,progress:{forest:0,space:0,ocean:0,fruit:0},sound:true};
try{const raw=localStorage.getItem("pp-save");if(raw)S=Object.assign(S,JSON.parse(raw));}catch(e){}
S.progress=Object.assign({forest:0,space:0,ocean:0,fruit:0},S.progress);
const save=()=>{try{localStorage.setItem("pp-save",JSON.stringify(S));}catch(e){}};

let screen="home",worldId=null,level=1,qIndex=0,question=null,picked=null,earned=0,correctCount=0,totalRounds=PER_LEVEL;

/* ============ UTIL ============ */
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
const W=()=>WORLDS.find(w=>w.id===worldId);
function roundsFor(w,lv){if(w==="fruit"){if(lv===3)return 3;if(lv===4)return 2;}if(w==="space"&&lv===4)return 3;return PER_LEVEL;}
/* Shuffled-deck picker: every item appears once before any repeats, never twice in a row. */
const drawState={};
function draw(key,list){
  const s=drawState[key]||(drawState[key]={deck:[],last:null});
  if(!s.deck.length){
    s.deck=shuffle(list);
    if(s.deck[s.deck.length-1]===s.last&&s.deck.length>1)s.deck.unshift(s.deck.pop());
  }
  s.last=s.deck.pop();
  return s.last;
}
function mascot(){let m=MASCOTS[0];MASCOTS.forEach(x=>{if(S.stars>=x.min)m=x;});const i=MASCOTS.indexOf(m);return{...m,level:i+1,next:MASCOTS[i+1]||null};}

/* ============ SUARA (Web Audio, tanpa library) ============ */
let AC=null;
function tone(freq,start,dur,vol=.18){
  if(!S.sound)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type="triangle";o.frequency.value=freq;
    const t=AC.currentTime+start;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);
  }catch(e){}
}
const sCorrect=()=>{tone(523,0,.15);tone(659,.1,.15);tone(784,.2,.3);};
const sWrong=()=>{tone(196,0,.25,.14);};
const sWin=()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.25));};
function bestVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().replace("_","-").startsWith("id"));
  return vs.find(v=>/google/i.test(v.name))     // suara Google (Android) paling jernih
      || vs.find(v=>/enhanced|premium|siri/i.test(v.name))
      || vs[0] || null;
}
function speak(t){
  if(!S.sound||!window.speechSynthesis)return;
  try{
    speechSynthesis.cancel();
    // satu ucapan utuh; tanda "|" jadi koma agar jedanya alami dan tidak patah-patah
    const u=new SpeechSynthesisUtterance(t.split("|").map(p=>p.trim()).filter(Boolean).join(", "));
    u.lang="id-ID";u.rate=.88;u.pitch=1.08;u.volume=1;
    const v=bestVoice();if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if(window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();
}
const PRAISE=["Benar!|Kamu pintar!","Hore!|Hebat sekali!","Wah, betul!|Pintar!","Yes!|Jawabanmu benar!"];
const OOPS=["Belum tepat.|Ayo coba lagi!","Hampir!|Coba sekali lagi ya!","Tidak apa-apa.|Ayo coba lagi!"];

/* ============ SVG BENTUK ============ */
function shapeSVG(shape,color,size=70){
  const p=`fill="${color}" stroke="rgba(0,0,0,.15)" stroke-width="3"`;
  const body={
    lingkaran:`<circle cx="50" cy="50" r="42" ${p}/>`,
    kotak:`<rect x="12" y="12" width="76" height="76" rx="10" ${p}/>`,
    segitiga:`<polygon points="50,10 92,88 8,88" ${p}/>`,
    bintang:`<polygon points="50,6 61,38 95,38 68,58 78,92 50,71 22,92 32,58 5,38 39,38" ${p}/>`,
    hati:`<path d="M50 88 C20 62 8 44 14 28 C20 12 42 12 50 30 C58 12 80 12 86 28 C92 44 80 62 50 88 Z" ${p}/>`,
    oval:`<ellipse cx="50" cy="50" rx="44" ry="30" ${p}/>`,
    ketupat:`<polygon points="50,8 92,50 50,92 8,50" ${p}/>`
  }[shape];
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100">${body}</svg>`;
}

/* ============ SOAL ============ */
function makeQuestion(w,lv){
  if(w==="forest"){
    if(lv<3){
      const max=lv===1?5:9,count=1+rand(max),a=pick(ANIMALS);
      const o=new Set([count]);while(o.size<3)o.add(Math.max(1,count+rand(5)-2));
      return{type:"count",prompt:"Ada berapa hewan ini?",speak:"Ayo hitung!|Ada berapa hewan ini?",
        html:`<div style="font-size:44px;line-height:1.4;margin-top:14px;word-spacing:8px">${Array(count).fill(a).join(" ")}</div>`,
        answer:count,options:shuffle([...o])};
    }
    if(lv===3){
      const a=1+rand(4),b=1+rand(4),an=pick(ANIMALS),acc=W().accent;
      const o=new Set([a+b]);while(o.size<3)o.add(Math.max(1,a+b+rand(5)-2));
      return{type:"add",prompt:"Berapa jumlah semuanya?",speak:`Ayo hitung!|${a}|tambah|${b}|jadi berapa semuanya?`,
        html:`<div style="font-size:36px;margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px">
          <span>${Array(a).fill(an).join("")}</span><span style="font-weight:700;color:${acc}">+</span>
          <span>${Array(b).fill(an).join("")}</span><span style="font-weight:700;color:${acc}">= ?</span></div>`,
        answer:a+b,options:shuffle([...o])};
    }
    // lv4: subtraction — some animals go home, how many stay?
    const total=4+rand(6),leave=1+rand(total-2),left=total-leave,an=pick(ANIMALS);
    const o=new Set([left]);while(o.size<3)o.add(Math.max(1,left+rand(5)-2));
    return{type:"sub",prompt:"Berapa hewan yang tersisa?",
      speak:`Ada ${total} hewan.|Lalu ${leave} hewan pulang ke rumah.|Berapa hewan yang masih tinggal?`,
      html:`<div style="font-size:36px;margin-top:14px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px">
        <span>${Array(left).fill(an).join("")}</span>
        <span style="opacity:.35;filter:grayscale(1)">${Array(leave).fill(an).join("")}</span>
        <span style="font-size:30px">➡️🏠</span></div>`,
      answer:left,options:shuffle([...o])};
  }
  if(w==="space"){
    const acc=W().accent;
    if(lv===2){
      const big=draw("spaceConf",Object.keys(CONF)),o=CONF[big];
      return{type:"low",prompt:`Mana huruf kecil dari "${big}"?`,speak:`Ini huruf ${big} besar.|Mana huruf ${big} yang kecil?`,
        html:`<div style="font-size:84px;font-weight:700;margin-top:8px;color:${acc}">${big}</div>`,
        answer:o[0],options:shuffle([...o])};
    }
    if(lv===4){ // Susun Kata — arrange letters to spell a space word (with decoy letters)
      if(qIndex===0)spellOrder=shuffle(SPELL_WORDS);
      const sw=spellOrder[qIndex%SPELL_WORDS.length];
      const extra=new Set();
      while(extra.size<2){const L=String.fromCharCode(65+rand(26));if(!sw.w.includes(L))extra.add(L);}
      return{type:"spell",prompt:`Susun kata: ${sw.w}`,
        speak:`Ini ${sw.w.toLowerCase()}.|Ayo susun hurufnya satu per satu!|${sw.w.split("").join("|")}`,
        word:sw.w,e:sw.e,letters:shuffle([...sw.w,...extra]),filled:0,used:new Set()};
    }
    const word=draw("spaceWord"+lv,lv===1?EASY:HARD),first=word.w[0].toUpperCase();
    const o=new Set([first]);while(o.size<3)o.add(String.fromCharCode(65+rand(26)));
    return{type:"letter",prompt:"Huruf apa yang hilang?",speak:`Lihat gambarnya.|Ini ${word.w}.|${word.w}.|Huruf apa yang pertama?`,
      html:`<div style="margin-top:12px"><div style="font-size:64px">${word.e}</div>
        <div style="font-size:38px;font-weight:700;letter-spacing:4px;color:${acc}">_${word.w.slice(1)}</div></div>`,
      answer:first,options:shuffle([...o])};
  }
  if(w==="fruit"){
    if(lv===1){ // Beli Buah — hitung & ketuk
      if(Math.random()<.55){
        const f=pick(FRUITS),need=2+rand(4);
        const others=shuffle(FRUITS.filter(x=>x.id!==f.id)).slice(0,3);
        const items=shuffle([...Array(need+1+rand(2)).fill(f),...Array(3+rand(2)).fill(0).map(()=>pick(others))]);
        return{type:"tapcount",prompt:`Ketuk ${need} ${f.name.toLowerCase()}!`,
          speak:`Ibu mau beli ${need} ${f.name}.|Ayo ketuk ${need} ${f.name}!`,
          items,target:f.id,need,sel:new Set()};
      }
      const f=pick(FRUITS),others=shuffle(FRUITS.filter(x=>x.id!==f.id)).slice(0,3);
      const items=shuffle([...Array(2+rand(3)).fill(f),...Array(3+rand(3)).fill(0).map(()=>pick(others))]);
      return{type:"tapall",prompt:`Ketuk semua ${f.name.toLowerCase()}!`,
        speak:`Cari semua ${f.name}.|Ayo ketuk semuanya!`,
        items,target:f.id,need:items.filter(x=>x.id===f.id).length,sel:new Set()};
    }
    if(lv===2){ // Tebak Buah — pilih gambar / tebak bayangan
      const f=pick(FRUITS);
      if(Math.random()<.5){
        const others=shuffle(FRUITS.filter(x=>x.id!==f.id)).slice(0,3);
        return{type:"mc",prompt:`Sentuh ${f.name.toLowerCase()}!`,speak:`Mana ${f.name}?|Ayo sentuh!`,html:"",
          answer:f.id,options:shuffle([f,...others]).map(x=>({key:x.id,e:x.e}))};
      }
      const others=shuffle(FRUITS.filter(x=>x.id!==f.id)).slice(0,2);
      return{type:"mc",prompt:"Bayangan buah apa ini?",speak:"Lihat bayangan ini.|Buah apa ya?|Sentuh buah yang sama!",
        html:`<div style="font-size:84px;margin-top:10px;filter:brightness(0);opacity:.8">${f.e}</div>`,
        answer:f.id,options:shuffle([f,...others]).map(x=>({key:x.id,e:x.e}))};
    }
    if(lv===3){ // Keranjang Warna — kelompokkan buah
      const sortable=COLORS.filter(c=>FRUITS.filter(f=>f.color===c.id).length>=2);
      const baskets=shuffle(sortable).slice(0,qIndex>=2?3:2);
      const fruits=shuffle(baskets.flatMap(b=>shuffle(FRUITS.filter(f=>f.color===b.id)).slice(0,2)));
      return{type:"sort",prompt:"Masukkan buah ke keranjang warnanya!",
        speak:"Sentuh buah,|lalu sentuh keranjang yang warnanya sama!",
        baskets,fruits,done:[],selFruit:null};
    }
    // lv 4: Kartu Buah — memory
    const fs=shuffle(FRUITS).slice(0,qIndex===0?3:4);
    return{type:"memory",prompt:"Temukan pasangan buah yang sama!",
      speak:"Balik kartunya.|Cari dua buah yang sama!",
      cards:shuffle([...fs,...fs]),open:[],matched:new Set(),lock:false};
  }
  if(lv===1){
    const t=pick(SHAPES),c=pick(COLORS),others=shuffle(SHAPES.filter(s=>s.id!==t.id)).slice(0,3);
    return{type:"shape",prompt:`Sentuh bentuk ${t.label}!`,speak:`Mana bentuk ${t.label}?|Ayo sentuh!`,html:"",
      answer:t.id,options:shuffle([t,...others]).map(s=>({key:s.id,shape:s.id,color:c.hex}))};
  }
  if(lv===2){
    const t=pick(COLORS),s=pick(SHAPES),others=shuffle(COLORS.filter(c=>c.id!==t.id)).slice(0,3);
    return{type:"color",prompt:`Sentuh warna ${t.label}!`,speak:`Mana warna ${t.label}?|Ayo sentuh!`,html:"",
      answer:t.id,options:shuffle([t,...others]).map(c=>({key:c.id,shape:s.id,color:c.hex}))};
  }
  if(lv===3){
    const ts=pick(SHAPES),tc=pick(COLORS),opts=[{key:"benar",shape:ts.id,color:tc.hex}];
    while(opts.length<4){const s=pick(SHAPES),c=pick(COLORS);if(s.id===ts.id&&c.id===tc.id)continue;opts.push({key:s.id+c.id+opts.length,shape:s.id,color:c.hex});}
    return{type:"combo",prompt:`Sentuh ${ts.label} ${tc.label}!`,speak:`Cari ${ts.label}.|Yang berwarna ${tc.label}.|Ayo sentuh!`,html:"",
      answer:"benar",options:shuffle(opts)};
  }
  // lv4: Pola Ajaib — continue the shape & color pattern (ABAB, later ABC-ABC)
  const acc=W().accent,n=qIndex>=3?3:2;
  const shs=shuffle(SHAPES).slice(0,n),cls=shuffle(COLORS).slice(0,n);
  const units=shs.map((s,i)=>({shape:s.id,color:cls[i].hex}));
  const shown=Array.from({length:5},(_,i)=>units[i%n]),ansUnit=units[5%n];
  const opts=[{key:"benar",shape:ansUnit.shape,color:ansUnit.color}];
  units.forEach((u,i)=>{if(u!==ansUnit)opts.push({key:"u"+i,shape:u.shape,color:u.color});});
  while(opts.length<3){const s=pick(SHAPES),c=pick(COLORS);
    if(opts.some(o=>o.shape===s.id&&o.color===c.hex))continue;
    opts.push({key:"x"+opts.length,shape:s.id,color:c.hex});}
  return{type:"pattern",prompt:"Bentuk apa selanjutnya?",
    speak:"Lihat polanya baik-baik.|Bentuk apa yang cocok selanjutnya?|Ayo sentuh!",
    html:`<div style="display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px">
      ${shown.map(u=>shapeSVG(u.shape,u.color,52)).join("")}
      <div style="width:52px;height:52px;border:3px dashed ${acc};border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:${acc}">?</div></div>`,
    answer:"benar",options:shuffle(opts)};
}

/* ============ ALUR ============ */
function startLevel(w,lv){
  if(demoLocked(lv))return;
  worldId=w;level=lv;qIndex=0;earned=0;correctCount=0;picked=null;
  totalRounds=roundsFor(w,lv);
  question=makeQuestion(w,lv);screen="game";render();
  setTimeout(()=>speak(question.speak),450);
}
function nextQuestion(){
  if(qIndex+1>=totalRounds){
    sWin();
    S.progress[worldId]=Math.max(S.progress[worldId],level);save();
    screen="done";render();
    setTimeout(()=>speak(`Hore!|Kamu dapat ${earned} bintang!|Hebat sekali!`),500);
    return;
  }
  qIndex++;picked=null;question=makeQuestion(worldId,level);render();
  setTimeout(()=>speak(question.speak),300);
}
function winRound(star=1){
  sCorrect();S.stars+=star;earned+=star;correctCount++;save();
  speak(pick(PRAISE));render();
  setTimeout(nextQuestion,1150);
}
function answer(val){
  if(picked!==null)return;
  picked=val;
  if(String(val)===String(question.answer)){
    winRound();
  }else{
    sWrong();speak(pick(OOPS));render();
    setTimeout(()=>{picked=null;render();},900);
  }
}
function shakeBtn(b){b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");}

/* ============ RENDER ============ */
const app=document.getElementById("app");
const backBtn=document.getElementById("back");
const soundBtn=document.getElementById("sound");
const starEl=document.getElementById("starCount");

backBtn.onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();
  if(screen==="home"){location.href="./";return;}
  screen=(screen==="game"||screen==="done")?"world":"home";render();};
soundBtn.onclick=()=>{S.sound=!S.sound;save();if(!S.sound&&window.speechSynthesis)speechSynthesis.cancel();render();};

function render(){
  document.body.style.background=(screen==="game"||screen==="done")?W().bg:HOME_BG;
  document.body.style.backgroundAttachment="fixed";
  starEl.textContent="⭐ "+S.stars;
  soundBtn.textContent=S.sound?"🔊":"🔇";
  document.querySelectorAll(".confetti").forEach(c=>c.remove());

  if(screen==="home")return renderHome();
  if(screen==="world")return renderWorld();
  if(screen==="game")return renderGame();
  if(screen==="done")return renderDone();
}

function renderHome(){
  const m=mascot();
  const prog=m.next?Math.min(100,((S.stars-m.min)/(m.next.min-m.min))*100):100;
  app.innerHTML=`
   <div style="text-align:center">
     <img src="./assets/logo.svg" alt="" style="width:92px;height:92px">
     <h1 style="margin-top:2px;line-height:1.1">Petualangan Pintar<br>
       <span style="font-size:22px;color:#F25C2A">✨ Si Kecil ✨</span></h1>
   </div>
   <div class="card" style="display:flex;align-items:center;gap:16px">
     <div class="bounce" style="font-size:60px">${m.emoji}</div>
     <div style="flex:1">
       <div class="title">${m.name}</div>
       <div class="sub">Level ${m.level}</div>
       ${m.next?`<div class="bar"><div style="width:${prog}%"></div></div>
         <div style="font-size:13px;margin-top:4px;opacity:.7">${m.next.min-S.stars} ⭐ lagi jadi ${m.next.emoji}</div>`
        :`<div style="font-size:14px;margin-top:4px">🏆 Level tertinggi!</div>`}
     </div>
   </div>
   ${WORLDS.map(w=>`
     <button class="btn world-btn" data-world="${w.id}">
       <div class="world-emoji" style="background:${w.bg}">${w.emoji}</div>
       <div style="flex:1"><div class="title">${w.name}</div><div class="sub">${w.subtitle}</div></div>
       <div style="display:flex;gap:4px;font-size:18px">${Array.from({length:w.levels||3},(_,i)=>S.progress[w.id]>=i+1?"⭐":"▫️").join("")}</div>
     </button>`).join("")}
   ${DEMO_MODE?`<div class="card" style="text-align:center;padding:16px">
     <div class="title" style="font-size:17px">Untuk Ayah &amp; Bunda 👨‍👩‍👧</div>
     <div class="sub" style="margin:4px 0 12px">Suka demonya? Versi lengkap membuka semua level.</div>
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
       <a class="btn" href="./portal/masuk" style="padding:12px 18px;font-size:16px;font-weight:700;background:#FFC93C">👤 Masuk Akun</a>
       <a class="btn" href="./" style="padding:12px 18px;font-size:16px;font-weight:700">🏠 Halaman Utama</a>
     </div>
   </div>`:""}`;
  app.querySelectorAll("[data-world]").forEach(b=>b.onclick=()=>{worldId=b.dataset.world;screen="world";render();});
}

function renderWorld(){
  const w=W();
  app.innerHTML=`
   <div style="text-align:center">
     <div style="font-size:70px">${w.emoji}</div>
     <h1 style="font-size:28px">${w.name}</h1>
     <div class="sub" style="font-size:17px">${w.subtitle}</div>
   </div>
   ${Array.from({length:w.levels||3},(_,idx)=>{
     const lv=idx+1;
     const unlocked=(lv===1||S.progress[w.id]>=lv-1)&&!demoLocked(lv), done=S.progress[w.id]>=lv;
     const name=w.levelNames?w.levelNames[lv-1]:`Level ${lv}`;
     const unit=w.id==="fruit"?"ronde":(w.id==="space"&&lv===4?"kata":"soal");
     return `<button class="btn" data-lv="${lv}" ${unlocked?"":"disabled"}
       style="padding:16px;display:flex;align-items:center;gap:14px;background:${unlocked?w.light:"#DDD"}">
       <div style="font-size:32px">${done?"⭐":unlocked?"🎯":"🔒"}</div>
       <div style="text-align:left;flex:1">
         <div class="title" style="color:${w.accent}">${name}</div>
         <div class="sub" style="font-size:14px">${done?"Sudah selesai — main lagi yuk!":unlocked?`${roundsFor(w.id,lv)} ${unit} seru menantimu`:demoLocked(lv)?"Ada di versi lengkap 🎁":"Selesaikan level sebelumnya dulu"}</div>
       </div></button>`;}).join("")}`;
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>startLevel(w.id,+b.dataset.lv));
}

function dotsHTML(){
  return `<div class="dots">${Array.from({length:totalRounds},(_,i)=>
    `<div class="dot ${i<qIndex?"done":i===qIndex?"now":""}"></div>`).join("")}</div>`;
}
function promptCard(extra=""){
  const w=W(),q=question;
  return `<div class="card pop" style="text-align:center">
     <div style="display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap">
       <div class="prompt" style="color:${w.accent}">${q.prompt}</div>
       <button class="btn" id="repeat" style="background:#FFC93C;padding:6px 12px;font-size:18px">🔊</button>
     </div>
     ${q.html||""}${extra}
   </div>`;
}
function renderGame(){
  const q=question;
  if(q.type==="tapcount"||q.type==="tapall")return renderTapGame();
  if(q.type==="sort")return renderSortGame();
  if(q.type==="memory")return renderMemoryGame();
  if(q.type==="spell")return renderSpellGame();
  renderChoiceGame();
}
function renderChoiceGame(){
  const q=question,cols=q.options.length===4?"1fr 1fr":"repeat(3,1fr)";
  app.innerHTML=`
   ${dotsHTML()}
   ${promptCard()}
   <div class="opts" style="grid-template-columns:${cols}">
     ${q.options.map(o=>{
       const isObj=typeof o==="object", val=isObj?o.key:o;
       const sel=picked!==null&&String(picked)===String(val);
       const ok=String(val)===String(question.answer);
       const cls=sel?(ok?"good pop":"bad shake"):"";
       const face=isObj?(o.shape?shapeSVG(o.shape,o.color):`<span style="font-size:50px">${o.e}</span>`):val;
       return `<button class="btn opt ${cls}" data-val="${val}">${face}</button>`;
     }).join("")}
   </div>`;
  document.getElementById("repeat").onclick=()=>speak(q.speak);
  app.querySelectorAll("[data-val]").forEach(b=>b.onclick=()=>answer(b.dataset.val));
}
/* Level "Beli Buah": ketuk sejumlah buah (tapcount) atau semua buah target (tapall) */
function renderTapGame(){
  const q=question;
  app.innerHTML=`
   ${dotsHTML()}
   ${promptCard(`<div id="basketCount" style="font-size:22px;font-weight:700;margin-top:10px">🧺 ${q.sel.size} / ${q.need}</div>`)}
   <div class="opts" style="grid-template-columns:repeat(3,1fr)">
     ${q.items.map((f,i)=>`<button class="btn opt ${q.sel.has(i)?"good":""}" data-i="${i}"
        style="font-size:46px;${q.sel.has(i)?"opacity:.6":""}">${f.e}</button>`).join("")}
   </div>`;
  document.getElementById("repeat").onclick=()=>speak(q.speak);
  const counter=document.getElementById("basketCount");
  app.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{
    if(q.finished)return;
    const i=+b.dataset.i;
    if(q.sel.has(i))return;
    if(q.items[i].id!==q.target){shakeBtn(b);sWrong();speak(pick(OOPS));return;}
    q.sel.add(i);
    b.classList.add("good");b.style.opacity=".6";
    b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
    tone(440+q.sel.size*70,0,.15);
    counter.textContent=`🧺 ${q.sel.size} / ${q.need}`;
    if(q.sel.size>=q.need){q.finished=true;setTimeout(()=>winRound(),350);}
  });
}
/* Level "Keranjang Warna": sentuh buah lalu sentuh keranjang warna yang cocok */
function renderSortGame(){
  const q=question,acc=W().accent;
  const lum=h=>{const n=parseInt(h.slice(1),16);return .299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255);};
  app.innerHTML=`
   ${dotsHTML()}
   ${promptCard()}
   <div style="display:flex;gap:12px">
     ${q.baskets.map(b=>`
      <button class="btn" data-basket="${b.id}" style="flex:1;padding:10px 6px;border:5px solid #fff;background:${b.hex};border-radius:22px">
        <div style="font-size:36px">🧺</div>
        <div style="font-weight:700;font-size:16px;margin-top:2px;color:${lum(b.hex)>160?"#3A2E20":"#fff"}">${b.label}</div>
        <div id="bin-${b.id}" style="font-size:26px;min-height:38px;margin-top:6px;background:rgba(255,255,255,.4);border-radius:12px;padding:2px 4px">${q.done.map(i=>q.fruits[i]).filter(f=>f.color===b.id).map(f=>f.e).join("")}</div>
      </button>`).join("")}
   </div>
   <div class="opts" style="grid-template-columns:repeat(${Math.min(q.fruits.length,4)},1fr)">
     ${q.fruits.map((f,i)=>`<button class="btn opt" data-f="${i}"
        style="font-size:42px;${q.done.includes(i)?"visibility:hidden;":""}${q.selFruit===i?`outline:5px solid ${acc};`:""}">${f.e}</button>`).join("")}
   </div>`;
  document.getElementById("repeat").onclick=()=>speak(q.speak);
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.f;
    if(q.done.includes(i)||q.finished)return;
    q.selFruit=i;
    app.querySelectorAll("[data-f]").forEach(x=>x.style.outline="");
    b.style.outline=`5px solid ${acc}`;
    tone(520,0,.1);
  });
  app.querySelectorAll("[data-basket]").forEach(b=>b.onclick=()=>{
    if(q.finished)return;
    if(q.selFruit===null){speak("Sentuh buahnya dulu ya!");return;}
    const f=q.fruits[q.selFruit];
    if(f.color===b.dataset.basket){
      q.done.push(q.selFruit);
      const fb=app.querySelector(`[data-f="${q.selFruit}"]`);
      fb.style.visibility="hidden";fb.style.outline="";
      document.getElementById("bin-"+b.dataset.basket).textContent+=f.e;
      q.selFruit=null;
      tone(660,0,.12);tone(880,.09,.15);
      if(q.done.length===q.fruits.length){q.finished=true;setTimeout(()=>winRound(2),400);}
    }else{
      shakeBtn(b);sWrong();speak(pick(OOPS));
    }
  });
}
/* Level "Kartu Buah": memory mencocokkan pasangan kartu */
function renderMemoryGame(){
  const q=question,cols=q.cards.length<=6?3:4;
  app.innerHTML=`
   ${dotsHTML()}
   ${promptCard()}
   <div class="opts" style="grid-template-columns:repeat(${cols},1fr)">
     ${q.cards.map((c,i)=>{
       const up=q.matched.has(i)||q.open.includes(i);
       return `<button class="btn opt ${q.matched.has(i)?"good":""}" data-c="${i}" style="font-size:44px">${up?c.e:"❓"}</button>`;
     }).join("")}
   </div>`;
  document.getElementById("repeat").onclick=()=>speak(q.speak);
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.c;
    if(q.lock||q.finished||q.matched.has(i)||q.open.includes(i))return;
    q.open.push(i);
    b.textContent=q.cards[i].e;
    b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
    tone(600,0,.1);
    if(q.open.length<2)return;
    const [a,c2]=q.open;
    const btnA=app.querySelector(`[data-c="${a}"]`),btnB=app.querySelector(`[data-c="${c2}"]`);
    if(q.cards[a].id===q.cards[c2].id){
      q.matched.add(a);q.matched.add(c2);q.open=[];
      btnA.classList.add("good");btnB.classList.add("good");
      sCorrect();
      if(q.matched.size===q.cards.length){q.finished=true;setTimeout(()=>winRound(q.cards.length/2),500);}
    }else{
      q.lock=true;tone(240,0,.2,.1);
      setTimeout(()=>{
        btnA.textContent="❓";btnB.textContent="❓";
        btnA.classList.remove("pop");btnB.classList.remove("pop");
        q.open=[];q.lock=false;
      },850);
    }
  });
}

/* Level "Susun Kata": tap letters in order to spell the word */
function renderSpellGame(){
  const q=question,w=W();
  const z=q.word.length>5?{w:34,h:46,lh:42,f:24,m:2}:{w:44,h:56,lh:52,f:32,m:3};
  const slots=q.word.split("").map((ch,i)=>
    `<span style="display:inline-block;width:${z.w}px;height:${z.h}px;line-height:${z.lh}px;margin:2px ${z.m}px;border-radius:12px;font-size:${z.f}px;font-weight:700;
      background:${i<q.filled?w.light:"#fff"};border:3px ${i<q.filled?"solid":"dashed"} ${w.accent};color:${w.accent}">${i<q.filled?ch:""}</span>`).join("");
  app.innerHTML=`
   ${dotsHTML()}
   ${promptCard(`<div style="font-size:56px;margin-top:8px">${q.e}</div><div style="margin-top:10px">${slots}</div>`)}
   <div class="opts" style="grid-template-columns:repeat(4,1fr)">
     ${q.letters.map((L,i)=>`<button class="btn opt" data-l="${i}"
        style="font-size:36px;min-height:72px;${q.used.has(i)?"visibility:hidden;":""}">${L}</button>`).join("")}
   </div>`;
  document.getElementById("repeat").onclick=()=>speak(q.speak);
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
    if(q.finished)return;
    const i=+b.dataset.l;
    if(q.used.has(i))return;
    if(q.letters[i]===q.word[q.filled]){
      q.used.add(i);q.filled++;
      tone(500+q.filled*60,0,.12);
      if(q.filled===q.word.length){q.finished=true;render();setTimeout(()=>winRound(2),650);}
      else render();
    }else{shakeBtn(b);sWrong();speak(pick(OOPS));}
  });
}

function renderDone(){
  const w=W(),m=mascot();
  const c=document.createElement("div");c.className="confetti";
  const items=["🎉","⭐","🎊","✨","🌟","🎈"];
  c.innerHTML=Array.from({length:18},(_,i)=>
    `<span style="left:${(i*53)%100}%;font-size:${22+(i%4)*8}px;animation-duration:${2.2+(i%5)*.5}s;animation-delay:${i*.15}s">${items[i%6]}</span>`).join("");
  document.body.appendChild(c);

  app.innerHTML=`
   <div class="card pop" style="text-align:center;padding:26px;margin-top:16px">
     <div class="bounce" style="font-size:76px">${m.emoji}</div>
     <h1 style="font-size:29px;color:${w.accent}">Hebat Sekali! 🎉</h1>
     <div style="font-size:20px;margin-bottom:4px">Kamu dapat <b>${earned} ⭐</b> di ${w.levelNames?w.levelNames[level-1]:`Level ${level}`}!</div>
     <div class="sub" style="margin-bottom:18px">${["tapcount","tapall","sort","memory","spell"].includes(question.type)?`Semua ${totalRounds} ronde selesai — keren!`:`${correctCount} dari ${totalRounds} soal langsung benar`}</div>
     ${level<(w.levels||3)&&demoLocked(level+1)?`<div class="sub" style="margin-bottom:14px">Level berikutnya ada di versi lengkap 🎁 Coba dunia lain dulu, yuk!</div>`:""}
     <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
       ${level<(w.levels||3)&&!demoLocked(level+1)?`<button class="btn" id="next" style="background:#FFC93C;padding:14px 20px;font-size:18px;font-weight:700">Level Berikutnya ➡️</button>`:""}
       <button class="btn" id="again" style="padding:14px 20px;font-size:18px;font-weight:700">Main Lagi 🔄</button>
       <button class="btn" id="home" style="padding:14px 20px;font-size:18px;font-weight:700">Beranda 🏠</button>
     </div>
   </div>`;
  const n=document.getElementById("next");if(n)n.onclick=()=>startLevel(worldId,level+1);
  document.getElementById("again").onclick=()=>startLevel(worldId,level);
  document.getElementById("home").onclick=()=>{screen="home";render();};
}

render();
</script>
